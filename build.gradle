plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // JEI: the API is used at compile time; the full JEI is optional at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    // Simple Ores is REQUIRED (the weapons are crafted in its Gravity Core).
    // To test in runClient, put the Simple Ores jar (Fabric 26.2) in the "libs" folder.
    runtimeOnly fileTree(dir: 'libs', include: '*.jar')
}

processResources {
    var replaceProperties = [
            version                 : mod_version,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            minecraft_version_range : minecraft_version_range,
            loader_version          : loader_version,
            simpleores_version_range: simpleores_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
